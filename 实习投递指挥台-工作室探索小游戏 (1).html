<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>实习投递指挥台 · 工作室探索</title>
<style>
/* ===== 基础重置与页面 ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#fbf1de;
  font-family:"Nunito","Quicksand","PingFang SC","Hiragino Sans GB","Microsoft YaHei",ui-rounded,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:12px;color:#4a3f33;
  -webkit-tap-highlight-color:transparent;
}
#game-container{
  position:relative;
  width:min(1200px,100%);
  aspect-ratio:16/9;
  border-radius:24px;
  overflow:hidden;
  background:#fff6e8;
  box-shadow:0 22px 60px rgba(120,90,60,.28);
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
canvas{display:block;width:100%;height:100%}

/* ===== 场景遮罩 ===== */
#dim{
  position:absolute;inset:0;z-index:20;
  background:rgba(96,66,34,.16);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
#dim.show{opacity:1;pointer-events:auto}

/* ===== 面板通用 ===== */
.panel{
  position:absolute;left:50%;top:50%;z-index:30;
  width:min(580px,94%);
  max-height:88%;
  transform:translate(-50%,-50%) scale(.9);
  background:#fffdf8;
  border-radius:22px;
  box-shadow:0 18px 50px rgba(90,60,30,.28);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .28s cubic-bezier(.34,1.56,.64,1);
  display:flex;flex-direction:column;overflow:hidden;
  font-size:15px;
}
.panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;flex:0 0 auto;
  background:linear-gradient(135deg,#ecfff4,#fdf3e2);
  border-bottom:1px solid #f0e3cd;
}
.panel-title{font-weight:800;font-size:17px;color:#4a3f33}
.btn-close{
  width:34px;height:34px;flex:0 0 auto;border:none;border-radius:50%;
  background:#ffe9d6;color:#8a6a4a;font-size:16px;line-height:1;
  cursor:pointer;transition:transform .12s ease,background .12s ease;
}
.btn-close:hover{background:#ffdcc0}
.btn-close:active{transform:scale(.9)}
.panel-body{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:42px;padding:9px 16px;border:none;border-radius:14px;
  background:linear-gradient(180deg,#ffffff,#f6efe4);
  color:#5b4a3a;font-size:15px;font-weight:700;font-family:inherit;
  cursor:pointer;box-shadow:0 2px 6px rgba(120,90,50,.14);
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.96);box-shadow:0 1px 3px rgba(120,90,50,.16)}
.btn-primary{background:linear-gradient(180deg,#a8e6c3,#7fd4a6);color:#1e5b3d}
.btn-primary:active{filter:brightness(.96)}
.btn-danger{background:linear-gradient(180deg,#ffc9b8,#f7a98f);color:#8a3b26}
.btn-sm{min-height:34px;padding:5px 12px;font-size:13.5px;border-radius:11px}
.btn-del{background:#fff1ea;color:#c9604b}
.btn-clear{background:transparent;box-shadow:none;color:#c9604b;text-decoration:underline}
.btn-clear:active{transform:scale(.96)}

/* ===== 状态徽章与 chips ===== */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap}
.s-未投递{background:#ece7e0;color:#7b6f60}
.s-已投递{background:#dbeafe;color:#1d5fa8}
.s-笔试{background:#f1e0fb;color:#7c3fa8}
.s-面试{background:#ffedd5;color:#b4690e}
.s-Offer{background:#d9f6e5;color:#1e8a52}
.s-已挂{background:#ffe3dd;color:#c0392b}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border:none;border-radius:999px;
  background:#f2ead9;font-size:14px;font-weight:700;color:#6b5a48;font-family:inherit;
  cursor:pointer;transition:transform .12s ease,background .12s ease;
}
.chip:active{transform:scale(.94)}
.chip.active{background:#a8e6c3;color:#1e5b3d}
.chip .cnt{background:rgba(255,255,255,.75);border-radius:999px;padding:0 7px;font-size:14px}

/* ===== 投递记录 ===== */
.toolbar{margin-bottom:12px}
.record-form{background:#f7f1e3;border:2px dashed #e7d7b8;border-radius:16px;padding:14px;margin-bottom:14px}
.form-row{display:flex;gap:10px;margin-bottom:10px}
.record-form input,.record-form select{
  width:100%;padding:10px 12px;border:2px solid #ecdcc0;border-radius:12px;
  background:#fff;font-size:15px;font-family:inherit;color:#4a3f33;outline:none;
  transition:border-color .12s ease;
}
.record-form input:focus,.record-form select:focus{border-color:#7fd4a6}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.record-list{display:flex;flex-direction:column;gap:10px}
.rec-card{background:#fbf6ec;border:1px solid #f2e6d0;border-radius:16px;padding:12px 14px}
.rec-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.rec-company{font-size:16px;font-weight:800;color:#3f3327;overflow-wrap:anywhere}
.rec-sub{font-size:14px;color:#8a7a64;margin-bottom:6px}
.rec-note{font-size:14px;color:#6b5a48;background:#f4ead6;border-radius:10px;padding:7px 10px;margin-bottom:6px;overflow-wrap:anywhere}
.rec-link{font-size:13.5px;margin-bottom:8px;overflow-wrap:anywhere}
.rec-link a{color:#3d8fbb;text-decoration:none}
.rec-link a:hover{text-decoration:underline}
.rec-actions{display:flex;gap:8px;justify-content:flex-end}
.empty{
  text-align:center;color:#9a8a70;font-size:15px;line-height:1.9;
  padding:30px 12px;background:#faf5ea;border-radius:16px;
}
.empty .big{font-size:34px;display:block;margin-bottom:6px}

/* ===== 白板列表 ===== */
.board-list{display:flex;flex-direction:column;gap:8px}
.board-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#fbf6ec;border:1px solid #f2e6d0;border-radius:13px;padding:10px 13px;
}
.board-main{min-width:0}
.board-name{font-weight:800;font-size:15px;color:#3f3327;overflow-wrap:anywhere}
.board-sub{font-size:13.5px;color:#8a7a64}

/* ===== 文件柜 ===== */
.cabinet-info{font-size:15px;color:#6b5a48;background:#f7f1e3;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.cabinet-info b{color:#3f3327}
.cabinet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tip{font-size:14px;color:#9a8a70;line-height:1.7}

/* ===== 沙发统计 ===== */
.stats-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{
  background:#fbf6ec;border:1px solid #f2e6d0;border-radius:16px;
  padding:14px 8px;text-align:center;
}
.stat-emoji{font-size:26px;display:block;margin-bottom:4px}
.stat-num{font-size:24px;font-weight:800;color:#3f3327}
.stat-label{font-size:14px;color:#8a7a64;margin-top:2px}
.reminder-block{margin-top:4px}
.reminder-label{display:block;font-weight:700;font-size:15px;color:#4a3f33;margin-bottom:8px}
#reminder-input{
  width:100%;padding:11px 12px;border:2px solid #ecdcc0;border-radius:14px;
  background:#fff;font-size:15px;font-family:inherit;color:#4a3f33;outline:none;resize:vertical;
}
#reminder-input:focus{border-color:#7fd4a6}
.reminder-now{font-size:14px;color:#8a7a64;margin-top:8px;line-height:1.6}
.reminder-now b{color:#4a3f33}

/* ===== 帮助 ===== */
.help-text{font-size:15px;color:#5b4a3a;line-height:1.85;margin-bottom:16px}
.help-text p{margin-bottom:8px}
.help-text ul{padding-left:20px;margin-bottom:12px}
.help-text b{color:#3f3327}

/* ===== Toast ===== */
.toast{
  position:absolute;left:50%;bottom:18px;z-index:60;
  transform:translateX(-50%) translateY(10px);
  background:#3c5c4a;color:#eafff2;
  padding:9px 18px;border-radius:999px;font-size:14px;font-weight:700;
  opacity:0;pointer-events:none;white-space:nowrap;
  transition:opacity .25s ease,transform .25s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 确认框 ===== */
.confirm-mask{
  position:absolute;inset:0;z-index:70;
  background:rgba(80,55,30,.32);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.confirm-mask.show{opacity:1;pointer-events:auto}
.confirm-box{
  background:#fffdf8;border-radius:20px;padding:22px;width:min(420px,90%);
  box-shadow:0 18px 50px rgba(90,60,30,.3);
  transform:scale(.92);transition:transform .24s cubic-bezier(.34,1.56,.64,1);
}
.confirm-mask.show .confirm-box{transform:scale(1)}
.confirm-title{font-weight:800;font-size:17px;color:#3f3327;margin-bottom:8px}
.confirm-msg{font-size:15px;color:#6b5a48;line-height:1.7;margin-bottom:18px;overflow-wrap:anywhere}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ===== 虚拟方向键 ===== */
.dpad{
  display:none;position:absolute;left:14px;bottom:14px;z-index:40;
  grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;
}
body.has-touch .dpad{display:grid}
.dbtn{
  width:56px;height:56px;border:none;border-radius:16px;
  background:rgba(255,253,248,.88);color:#6b5a48;font-size:17px;
  box-shadow:0 3px 8px rgba(90,60,30,.22);
  transition:transform .1s ease,background .1s ease;
  touch-action:none;cursor:pointer;font-family:inherit;
}
.dbtn:active,.dbtn.pressed{transform:scale(.92);background:#a8e6c3}
#d-up{grid-column:2;grid-row:1}
#d-left{grid-column:1;grid-row:2}
#d-right{grid-column:3;grid-row:2}
#d-down{grid-column:2;grid-row:3}

/* ===== 焦点可见性 & 移动端 ===== */
:focus-visible{outline:3px solid #7fd4a6;outline-offset:2px;border-radius:6px}
@media (max-width:640px){
  body{padding:6px}
  #game-container{border-radius:16px}
  .panel{width:94%}
  .panel-title{font-size:16px}
  .record-form input,.record-form select,#reminder-input{font-size:16px}
  .btn{min-height:44px;font-size:15px}
  .stats-cards{grid-template-columns:repeat(2,1fr)}
  .form-row{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){
  .panel,.toast,.confirm-box,#dim{transition-duration:.01s}
}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="dim"></div>

  <!-- ===== 视图：投递记录管理（电脑） ===== -->
  <div class="panel" id="panel-records" role="dialog" aria-label="投递记录管理">
    <div class="panel-head">
      <div class="panel-title">💻 投递记录管理</div>
      <button class="btn-close" data-close aria-label="关闭">✕</button>
    </div>
    <div class="panel-body">
      <div class="toolbar">
        <button class="btn btn-primary" id="btn-add-record">＋ 添加记录</button>
      </div>
      <form class="record-form hidden" id="record-form" novalidate>
        <div class="form-row">
          <input type="text" id="f-company" placeholder="公司名称 *" maxlength="100" autocomplete="off">
          <input type="text" id="f-role" placeholder="岗位名称 *" maxlength="100" autocomplete="off">
        </div>
        <div class="form-row">
          <input type="date" id="f-date">
          <select id="f-status">
            <option>未投递</option>
            <option>已投递</option>
            <option>笔试</option>
            <option>面试</option>
            <option>Offer</option>
            <option>已挂</option>
          </select>
        </div>
        <input type="text" id="f-note" placeholder="备注（可选）" maxlength="300" autocomplete="off">
        <input type="text" id="f-link" placeholder="职位链接（可选）" maxlength="500" autocomplete="off">
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn" id="btn-cancel-form">取消</button>
        </div>
      </form>
      <div class="record-list" id="records-list"></div>
    </div>
  </div>

  <!-- ===== 视图：状态看板与筛选（白板） ===== -->
  <div class="panel" id="panel-board" role="dialog" aria-label="状态看板与筛选">
    <div class="panel-head">
      <div class="panel-title">📋 状态看板与筛选</div>
      <button class="btn-close" data-close aria-label="关闭">✕</button>
    </div>
    <div class="panel-body">
      <div class="chips" id="board-chips"></div>
      <div class="board-list" id="board-list"></div>
    </div>
  </div>

  <!-- ===== 视图：数据备份与导出（文件柜） ===== -->
  <div class="panel" id="panel-cabinet" role="dialog" aria-label="数据备份与导出">
    <div class="panel-head">
      <div class="panel-title">🗄️ 数据备份与导出</div>
      <button class="btn-close" data-close aria-label="关闭">✕</button>
    </div>
    <div class="panel-body">
      <div class="cabinet-info" id="cabinet-info"></div>
      <div class="cabinet-actions">
        <button class="btn btn-primary" id="btn-export">⬇ 导出 JSON</button>
        <button class="btn" id="btn-import">⬆ 导入 JSON</button>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <p class="tip">导出文件包含全部投递记录、提醒与元信息。导入时可以选择覆盖或合并。</p>
    </div>
  </div>

  <!-- ===== 视图：统计与提醒（沙发） ===== -->
  <div class="panel" id="panel-sofa" role="dialog" aria-label="统计与提醒">
    <div class="panel-head">
      <div class="panel-title">🛋️ 统计与提醒</div>
      <button class="btn-close" data-close aria-label="关闭">✕</button>
    </div>
    <div class="panel-body">
      <div class="stats-cards" id="stats-cards"></div>
      <div class="reminder-block">
        <label class="reminder-label" for="reminder-input">给自己的提醒</label>
        <textarea id="reminder-input" rows="2" maxlength="200" placeholder="例如：周五前跟进 A 公司"></textarea>
        <div class="reminder-now" id="reminder-now"></div>
      </div>
    </div>
  </div>

  <!-- ===== 视图：帮助与关于（书架） ===== -->
  <div class="panel" id="panel-help" role="dialog" aria-label="帮助与关于">
    <div class="panel-head">
      <div class="panel-title">📚 帮助与关于</div>
      <button class="btn-close" data-close aria-label="关闭">✕</button>
    </div>
    <div class="panel-body">
      <div class="help-text">
        <p><b>怎么玩</b></p>
        <ul>
          <li>用 WASD 或方向键移动小人</li>
          <li>靠近家具后按 E 或空格打开功能面板</li>
          <li>手机上：点一下家具即可走过去并打开，也可用左下角方向键</li>
        </ul>
        <p><b>数据存在哪里？</b></p>
        <p>所有数据都保存在浏览器本地（localStorage，键名以 wb_ 开头）。清除浏览器数据会丢失，建议定期到「文件柜」导出备份。</p>
        <p><b>家具地图</b></p>
        <p>书桌管投递记录，白板按状态筛选，文件柜备份数据，沙发看统计和提醒。</p>
      </div>
      <button class="btn btn-clear" id="btn-clear-all">清空所有数据（慎重）</button>
    </div>
  </div>

  <div class="toast" id="toast">已保存 ✓</div>
  <div class="confirm-mask" id="confirm-mask">
    <div class="confirm-box">
      <div class="confirm-title" id="confirm-title"></div>
      <div class="confirm-msg" id="confirm-msg"></div>
      <div class="confirm-actions" id="confirm-actions"></div>
    </div>
  </div>

  <div class="dpad" id="dpad">
    <button class="dbtn" id="d-up" aria-label="上">▲</button>
    <button class="dbtn" id="d-left" aria-label="左">◀</button>
    <button class="dbtn" id="d-right" aria-label="右">▶</button>
    <button class="dbtn" id="d-down" aria-label="下">▼</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================
 * 模块一：存储键与数据层
 * 存储键统一使用 wb_ 前缀；任何表单输入 300ms 防抖写库，
 * 面板关闭时强制同步保存，页面卸载（beforeunload）兜底保存。
 * ============================================================ */
const STORAGE_KEYS = {
  records: 'wb_internship_records', // 投递记录数组（JSON 字符串）
  notes:   'wb_stats_notes',        // 统计面板提醒文本
  meta:    'wb_meta',               // 最后保存时间、版本、引导标记
  draft:   'wb_record_draft'        // 添加表单未提交草稿
};

const STATUSES = ['未投递', '已投递', '笔试', '面试', 'Offer', '已挂'];

let records = [];        // 投递记录
let reminderText = '';   // 沙发提醒
let draft = {};          // 添加表单草稿
let meta = { version: 1, lastSavedAt: null, seenIntro: false };

/* 页面加载时读取全部数据；key 缺失或解析失败回退默认值，不崩溃 */
function loadAll() {
  try { const raw = localStorage.getItem(STORAGE_KEYS.records); records = raw ? JSON.parse(raw) : []; if (!Array.isArray(records)) records = []; } catch (e) { records = []; }
  try { const raw = localStorage.getItem(STORAGE_KEYS.notes); reminderText = raw ? String(JSON.parse(raw)) : ''; } catch (e) { reminderText = ''; }
  try { const raw = localStorage.getItem(STORAGE_KEYS.meta); if (raw) meta = Object.assign(meta, JSON.parse(raw)); } catch (e) { /* 保持默认 */ }
  try { const raw = localStorage.getItem(STORAGE_KEYS.draft); if (raw) { const d = JSON.parse(raw); if (d && typeof d === 'object') draft = d; } } catch (e) { draft = {}; }
}

/* 统一写库入口 */
function saveAll(showToastFlag) {
  meta.lastSavedAt = Date.now();
  try {
    localStorage.setItem(STORAGE_KEYS.records, JSON.stringify(records));
    localStorage.setItem(STORAGE_KEYS.notes, JSON.stringify(reminderText));
    localStorage.setItem(STORAGE_KEYS.meta, JSON.stringify(meta));
    localStorage.setItem(STORAGE_KEYS.draft, JSON.stringify(draft));
  } catch (e) { /* 隐私模式等写入失败时静默降级，不影响页面 */ }
  if (showToastFlag !== false) showToast('已保存 ✓');
}

let saveTimer = null;
/* 输入变化时 300ms 防抖写库，避免每次按键都写 */
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveAll(true), 300);
}
window.addEventListener('beforeunload', () => saveAll(false));

/* ============================================================
 * 模块二：工具函数
 * ============================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function safeLinkHTML(link) {
  if (!link || !String(link).trim()) return '';
  const t = String(link).trim();
  const href = /^https?:\/\//i.test(t) ? t : null;
  if (href) return '<div class="rec-link"><a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(href) + '</a></div>';
  return '<div class="rec-link">' + esc(t) + '</div>';
}

/* ============================================================
 * 模块三：游戏世界与状态
 * 房间 1280×720，地板区 FLOOR 为可行走范围；
 * 家具为 AABB 碰撞体，交互区 = 家具体向外扩 36px。
 * ============================================================ */
const WORLD = { w: 1280, h: 720 };
const FLOOR = { x: 60, y: 60, w: 1160, h: 600 };

const player = {
  x: 590, y: 380, w: 40, h: 52,   // 玩家包围盒（左上角坐标）
  vx: 0, vy: 0, facing: 1,
  moving: false, walkT: 0, touch: 0
};
const SPEED = 190; // px/s，约 3.2 px/帧（60fps）

let keys = {};
let virtualKeys = { up: false, down: false, left: false, right: false };
let gamePaused = false;   // 面板打开时暂停角色移动
let moveTarget = null;    // 点击地面后的自动行走目标
let pendingOpen = null;   // 点击家具后，走到交互区即打开的面板
let activeFurniture = null;

/* 家具定义：body 为碰撞/绘制矩形，zone 为交互区 */
const furnitures = [
  { id: 'desk',    panelId: 'panel-records', label: '投递记录', emoji: '💻',
    body: { x: 100, y: 270, w: 320, h: 150 }, draw: drawDesk },
  { id: 'board',   panelId: 'panel-board',   label: '状态筛选', emoji: '📋',
    body: { x: 1000, y: 80, w: 220, h: 160 }, draw: drawBoard },
  { id: 'cabinet', panelId: 'panel-cabinet', label: '备份导出', emoji: '🗄️',
    body: { x: 70, y: 470, w: 150, h: 180 }, draw: drawCabinet },
  { id: 'sofa',    panelId: 'panel-sofa',    label: '统计提醒', emoji: '🛋️',
    body: { x: 940, y: 470, w: 250, h: 160 }, draw: drawSofa },
  { id: 'shelf',   panelId: 'panel-help',    label: '帮助说明', emoji: '📚',
    body: { x: 800, y: 70, w: 180, h: 140 }, draw: drawShelf }
];
furnitures.forEach(f => {
  const m = 36;
  f.zone = { x: f.body.x - m, y: f.body.y - m, w: f.body.w + m * 2, h: f.body.h + m * 2 };
  f.zoneCenter = { x: f.zone.x + f.zone.w / 2, y: f.zone.y + f.zone.h / 2 };
});

/* ============================================================
 * 模块四：输入处理（键盘 / 虚拟方向键 / 画布点击）
 * ============================================================ */
const isCoarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
if (isCoarse) document.body.classList.add('has-touch');

function onKeyDown(e) {
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if (typing) {
    if (e.code === 'Escape') { e.target.blur(); closePanels(); }
    return;
  }
  if (gamePaused) {
    if (e.code === 'Escape') closePanels();
    return;
  }
  if (e.code === 'KeyE' || e.code === 'Space') {
    e.preventDefault();
    if (activeFurniture) openPanel(activeFurniture.panelId);
    return;
  }
  if (e.code === 'Escape') { closePanels(); return; }
  if (e.code.indexOf('Arrow') === 0) e.preventDefault();
  keys[e.code] = true;
}
function onKeyUp(e) { delete keys[e.code]; }
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', () => { keys = {}; virtualKeys = { up: false, down: false, left: false, right: false }; });

/* 虚拟方向键：pointer 事件统一桌面/触控 */
['up', 'left', 'right', 'down'].forEach(dir => {
  const b = document.getElementById('d-' + dir);
  const set = v => () => { virtualKeys[dir] = v; b.classList.toggle('pressed', v); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); set(true)(); });
  b.addEventListener('pointerup', set(false));
  b.addEventListener('pointerleave', set(false));
  b.addEventListener('pointercancel', set(false));
});

/* 画布点击：点家具 → 走过去并打开；点地面 → 走过去 */
const canvas = document.getElementById('game-canvas');
canvas.addEventListener('click', e => {
  if (gamePaused) return;
  const p = toWorld(e);
  let f = null, fd = 1e9;
  for (const it of furnitures) {
    if (p.x >= it.zone.x && p.x <= it.zone.x + it.zone.w && p.y >= it.zone.y && p.y <= it.zone.y + it.zone.h) {
      const d = dist(p, it.zoneCenter);
      if (d < fd) { fd = d; f = it; }
    }
  }
  if (f) { pendingOpen = f; moveTarget = adjacentPoint(f); }
  else { moveTarget = clampToFloor(p); }
});
function toWorld(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / rect.width * WORLD.w, y: (e.clientY - rect.top) / rect.height * WORLD.h };
}
function clampToFloor(p) { return { x: clamp(p.x, FLOOR.x + 6, FLOOR.x + FLOOR.w - 6), y: clamp(p.y, FLOOR.y + 6, FLOOR.y + FLOOR.h - 6) }; }
/* 家具旁停靠点：交互区边界上离玩家最近的点，再向家具中心方向退 24px，
 * 保证玩家停下时包围盒必然压到交互区，从而触发 pendingOpen 打开面板 */
function adjacentPoint(f) {
  const z = f.zone, zc = f.zoneCenter;
  const pc = { x: player.x + player.w / 2, y: player.y + player.h / 2 };
  const cx = clamp(pc.x, z.x, z.x + z.w), cy = clamp(pc.y, z.y, z.y + z.h);
  let ddx = zc.x - cx, ddy = zc.y - cy;
  const l = Math.hypot(ddx, ddy);
  if (l < 0.01) return clampToFloor({ x: cx, y: cy });
  ddx /= l; ddy /= l;
  return clampToFloor({ x: cx + ddx * 24, y: cy + ddy * 24 });
}

/* ============================================================
 * 模块五：更新逻辑（移动 / AABB 碰撞 / 交互检测）
 * ============================================================ */
function update(dt) {
  if (gamePaused) return;

  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp'] || virtualKeys.up) dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'] || virtualKeys.down) dy += 1;
  if (keys['KeyA'] || keys['ArrowLeft'] || virtualKeys.left) dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight'] || virtualKeys.right) dx += 1;

  let tvx = 0, tvy = 0;
  if (dx || dy) {
    moveTarget = null;
    const l = Math.hypot(dx, dy);
    tvx = dx / l * SPEED; tvy = dy / l * SPEED;
  } else if (moveTarget) {
    const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
    const ddx = moveTarget.x - cx, ddy = moveTarget.y - cy;
    const d = Math.hypot(ddx, ddy);
    if (d < 10) { moveTarget = null; }
    else { tvx = ddx / d * SPEED * 0.85; tvy = ddy / d * SPEED * 0.85; }
  }

  /* 平滑加减速（lerp），避免瞬移 */
  const k = Math.min(1, dt * 9);
  player.vx += (tvx - player.vx) * k;
  player.vy += (tvy - player.vy) * k;
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  /* 家具碰撞（AABB 推出）与房间边界 */
  const pbox = { x: player.x, y: player.y, w: player.w, h: player.h };
  for (const f of furnitures) resolveCollision(pbox, f.body);
  player.x = clamp(player.x, FLOOR.x, FLOOR.x + FLOOR.w - player.w);
  player.y = clamp(player.y, FLOOR.y, FLOOR.y + FLOOR.h - player.h);

  /* 行走动画 */
  const spd = Math.hypot(player.vx, player.vy);
  player.moving = spd > 14;
  if (player.moving) {
    player.walkT += dt;
    if (tvx > 20) player.facing = 1;
    else if (tvx < -20) player.facing = -1;
  }
  player.touch = Math.max(0, player.touch - dt * 2.5);

  /* 交互检测：与多个家具重叠时取中心距离最近者 */
  let best = null, bestD = 1e9;
  for (const f of furnitures) {
    if (aabb(pbox, f.zone)) {
      const d = dist({ x: player.x + player.w / 2, y: player.y + player.h / 2 }, f.zoneCenter);
      if (d < bestD) { bestD = d; best = f; }
    }
  }
  if (activeFurniture !== best) activeFurniture = best;

  /* 点击家具后的到达触发 */
  if (pendingOpen && aabb(pbox, pendingOpen.zone)) {
    const p = pendingOpen; pendingOpen = null;
    openPanel(p.panelId);
  }
}
function resolveCollision(p, r) {
  if (!aabb(p, r)) return;
  const ox = Math.min(p.x + p.w - r.x, r.x + r.w - p.x);
  const oy = Math.min(p.y + p.h - r.y, r.y + r.h - p.y);
  if (ox < oy) { if (p.x < r.x) p.x = r.x - p.w; else p.x = r.x + r.w; }
  else { if (p.y < r.y) p.y = r.y - p.h; else p.y = r.y + r.h; }
  player.x = p.x; player.y = p.y;
}

  rr(c, r.x + 6, r.y + 6, r.w - 12, 10, 5); c.fill();
  /* 两个抽屉 */
  const drawerH = (r.h - 40) / 2;
  [0, 1].forEach(i => {
    const dy = r.y + 26 + i * (drawerH + 12);
    c.fillStyle = '#b9844f';
    rr(c, r.x + 12, dy, r.w - 24, drawerH, 8); c.fill();
    /* 拉手 */
    c.fillStyle = '#f2e0c8';
    rr(c, r.x + r.w / 2 - 24, dy + drawerH / 2 - 6, 48, 12, 6); c.fill();
    c.fillStyle = 'rgba(0,0,0,.08)';
    rr(c, r.x + r.w / 2 - 24, dy + drawerH / 2 - 6, 48, 12, 6); c.fill();
    /* 锁孔 */
    c.fillStyle = '#8a6a4a';
    c.beginPath(); c.arc(r.x + 24, dy + drawerH / 2, 3.4, 0, Math.PI * 2); c.fill();
  });
  /* 标签 */
  c.fillStyle = '#fffbe9';
  rr(c, r.x + r.w - 34, r.y + 8, 26, 16, 5); c.fill();
  c.fillStyle = '#8a6a4a';
  c.font = '700 10px ' + FONT;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('投递', r.x + r.w - 21, r.y + 16);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
}
function drawSofa(c, r) {
  c.fillStyle = 'rgba(120,80,40,.12)';
  rr(c, r.x + 5, r.y + 8, r.w, r.h, 14); c.fill();
  /* 靠背 */
  c.fillStyle = '#8fd0a8';
  rr(c, r.x + 8, r.y + 8, r.w - 16, r.h * 0.62, 18); c.fill();
  /* 扶手 */
  c.fillStyle = '#a9dfc0';
  rr(c, r.x, r.y + r.h * 0.42, 28, r.h * 0.56, 11); c.fill();
  rr(c, r.x + r.w - 28, r.y + r.h * 0.42, 28, r.h * 0.56, 11); c.fill();
  /* 坐垫 */
  c.fillStyle = '#9fd9b4';
  rr(c, r.x + 10, r.y + r.h * 0.42, r.w - 20, r.h * 0.58, 14); c.fill();
  /* 坐垫缝线 */
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 3;
  [r.w * 0.35, r.w * 0.62].forEach(fx => {
    c.beginPath(); c.moveTo(r.x + fx, r.y + r.h * 0.5); c.lineTo(r.x + fx, r.y + r.h * 0.94); c.stroke();
  });
  /* 靠枕 */
  c.fillStyle = '#ffd9c9';
  rr(c, r.x + 24, r.y + 22, 60, 46, 12); c.fill();
  c.fillStyle = '#d9ecff';
  rr(c, r.x + r.w - 84, r.y + 22, 60, 46, 12); c.fill();
  /* 茶几（沙发前方） */
  const tx = r.x + r.w * 0.5, ty = r.y - 26;
  c.fillStyle = 'rgba(120,80,40,.1)';
  c.beginPath(); c.ellipse(tx + 3, ty + 8, 44, 20, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#e3bd86';
  rr(c, tx - 6, ty + 6, 12, 22, 4); c.fill();
  c.fillStyle = '#eccb9a';
  c.beginPath(); c.ellipse(tx, ty, 44, 18, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#d6ab74'; c.lineWidth = 2.4;
  c.beginPath(); c.ellipse(tx, ty, 44, 18, 0, 0, Math.PI * 2); c.stroke();
  /* 茶杯 */
  c.fillStyle = '#ffffff';
  rr(c, tx - 10, ty - 10, 20, 16, 5); c.fill();
  c.fillStyle = '#c08e57';
  rr(c, tx - 10, ty - 10, 20, 5, 3); c.fill();
}
function drawShelf(c, r) {
  c.fillStyle = 'rgba(120,80,40,.12)';
  rr(c, r.x + 4, r.y + 8, r.w, r.h, 10); c.fill();
  c.fillStyle = '#b07a4f';
  rr(c, r.x, r.y, r.w, r.h, 10); c.fill();
  c.fillStyle = 'rgba(255,255,255,.2)';
  rr(c, r.x + 6, r.y + 5, r.w - 12, 8, 4); c.fill();
  /* 层板 */
  c.fillStyle = '#9a6a3f';
  [0.42, 0.72].forEach(fy => {
    rr(c, r.x + 2, r.y + r.h * fy, r.w - 4, 8, 3); c.fill();
  });
  /* 书 */
  const cols = ['#e58e8e', '#8ecae6', '#a8e6c3', '#ffd166', '#cdb4db', '#ffb4a2'];
  const shelves = [0.42, 0.72, 1];
  const hs = [30, 36, 26, 40, 32, 26];
  shelves.forEach((sy, row) => {
    let bx = r.x + 14;
    for (let i = 0; i < 6 && bx < r.x + r.w - 18; i++) {
      const h = hs[(row * 2 + i) % hs.length];
      c.fillStyle = cols[(row + i) % cols.length];
      rr(c, bx, r.y + r.h * sy - h + 8, 15, h, 3); c.fill();
      bx += 19 + (i % 3) * 2;
    }
  });
  /* 顶部小盆栽 */
  const px = r.x + r.w - 30;
  c.fillStyle = '#e59d6d';
  rr(c, px, r.y + 6, 20, 14, 4); c.fill();
  c.fillStyle = '#6fbf73';
  c.beginPath(); c.ellipse(px + 10, r.y - 2, 7, 11, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(px + 3, r.y + 4, 4.5, 7, 0.4, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(px + 17, r.y + 4, 4.5, 7, -0.4, 0, Math.PI * 2); c.fill();
  /* 相框 */
  c.fillStyle = '#f7e3c0';
  rr(c, r.x + 14, r.y + 10, 34, 26, 4); c.fill();
  c.strokeStyle = '#e6c99b'; c.lineWidth = 2.4; rr(c, r.x + 14, r.y + 10, 34, 26, 4); c.stroke();
  c.fillStyle = '#bfe6ff'; rr(c, r.x + 17, r.y + 13, 28, 20, 2); c.fill();
  c.fillStyle = '#ffd966'; c.beginPath(); c.arc(r.x + 36, r.y + 17, 4, 0, Math.PI * 2); c.fill();
}

/* —— 小人 —— */
function drawPlayer(c, t) {
  const cx = player.x + player.w / 2;
  const bottom = player.y + player.h;
  const walk = player.moving ? 1 : 0;
  const swing = Math.sin(player.walkT * 10) * 5 * walk;
  const bob = Math.abs(Math.cos(player.walkT * 10)) * 1.8 * walk;
  const lean = player.touch * 3;
  /* 阴影 */
  c.fillStyle = 'rgba(90,60,30,.16)';
  c.beginPath(); c.ellipse(cx, bottom - 1, 19, 5.5, 0, 0, Math.PI * 2); c.fill();

  c.save();
  c.translate(cx + lean * player.facing, bottom - bob);
  if (player.facing < 0) c.scale(-1, 1);
  /* 腿 */
  c.fillStyle = '#7fb3d9';
  rr(c, -10 + swing, -15, 9, 15, 4); c.fill();
  rr(c, 1 - swing, -15, 9, 15, 4); c.fill();
  /* 鞋 */
  c.fillStyle = '#f2b26b';
  rr(c, -11 + swing, -3.5, 11, 5.5, 3); c.fill();
  rr(c, 0 - swing, -3.5, 11, 5.5, 3); c.fill();
  /* 身体 */
  c.fillStyle = '#a8d8ea';
  rr(c, -12, -36, 24, 22, 10); c.fill();
  c.fillStyle = '#ffffff';
  rr(c, -4, -36, 8, 5, 3); c.fill();
  /* 手臂：触碰时前伸 */
  const reach = player.touch > 0 ? 7 * player.touch : 0;
  c.fillStyle = '#a8d8ea';
  rr(c, -14, -32, 7, 17 + reach, 4); c.fill();
  rr(c, 7, -32, 7, 17, 4); c.fill();
  /* 手 */
  c.fillStyle = '#ffe9c9';
  c.beginPath(); c.arc(-10.5, -13 - reach * 0.8, 3.2, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(10.5, -13, 3.2, 0, Math.PI * 2); c.fill();
  /* 头 */
  c.fillStyle = '#ffe9c9';
  c.beginPath(); c.arc(0, -48, 12.5, 0, Math.PI * 2); c.fill();
  /* 头发 */
  c.fillStyle = '#6b4a2f';
  c.beginPath(); c.arc(0, -53, 12.5, Math.PI * 1.02, Math.PI * 1.98); c.fill();
  /* 呆毛 */
  c.strokeStyle = '#6b4a2f'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(3, -59); c.quadraticCurveTo(7, -64, 12, -62); c.stroke();
  /* 眼睛 */
  c.fillStyle = '#3a2e22';
  c.beginPath(); c.arc(-4.5, -47, 1.9, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(4.5, -47, 1.9, 0, Math.PI * 2); c.fill();
  /* 腮红 */
  c.fillStyle = 'rgba(255,150,130,.45)';
  c.beginPath(); c.arc(-8.5, -44, 2.4, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(8.5, -44, 2.4, 0, Math.PI * 2); c.fill();
  /* 微笑 */
  c.strokeStyle = '#3a2e22'; c.lineWidth = 1.4;
  c.beginPath(); c.arc(0.5, -43.5, 3.4, 0.15, Math.PI - 0.5); c.stroke();
  c.restore();
}

/* —— 交互反馈：家具高亮 + 气泡 —— */
function drawGlow(c, r, t) {
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);
  c.save();
  c.shadowColor = 'rgba(127,212,166,.9)';
  c.shadowBlur = 20 + 10 * pulse;
  c.strokeStyle = 'rgba(127,212,166,' + (0.55 + 0.35 * pulse).toFixed(3) + ')';
  c.lineWidth = 3.5;
  rr(c, r.x - 5, r.y - 5, r.w + 10, r.h + 10, 16);
  c.stroke();
  c.restore();
}
function drawBubble(c, f, t) {
  const label = f.emoji + ' ' + f.label;
  const keyCap = isCoarse ? '👆' : 'E';
  c.font = '700 14px ' + FONT;
  const tw = c.measureText(label).width;
  const bw = tw + 68, bh = 40;
  const cx0 = clamp(f.body.x + f.body.w / 2, bw / 2 + 8, WORLD.w - bw / 2 - 8);
  const bx = cx0 - bw / 2, by = f.body.y - bh - 12;
  /* 尾巴 */
  c.fillStyle = '#ffffff';
  c.beginPath(); c.moveTo(cx0 - 9, by + bh - 2); c.lineTo(cx0 + 9, by + bh - 2); c.lineTo(cx0, by + bh + 11); c.closePath(); c.fill();
  /* 主体 */
  c.fillStyle = '#ffffff';
  rr(c, bx, by, bw, bh, 16); c.fill();
  c.strokeStyle = '#eadfc9'; c.lineWidth = 2;
  rr(c, bx, by, bw, bh, 16); c.stroke();
  /* 键帽 */
  c.fillStyle = '#7fd4a6';
  rr(c, bx + 10, by + 7, 26, 26, 8); c.fill();
  c.fillStyle = '#ffffff';
  c.font = '800 15px ' + FONT;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(keyCap, bx + 23, by + 21);
  /* 文字 */
  c.fillStyle = '#5b4a3a';
  c.font = '700 14px ' + FONT;
  c.textAlign = 'left';
  c.fillText(label, bx + 44, by + 21);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
}
function drawHint(c) {
  c.fillStyle = 'rgba(90,70,50,.55)';
  c.font = '600 13px ' + FONT;
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillText('WASD / 方向键移动 · 靠近家具按 E 或点击打开面板', WORLD.w / 2, WORLD.h - 12);
}

/* 总渲染：房间 → 家具（含高亮）→ 小人 → 气泡 → 提示 */
function render(t) {
  const c = ctx;
  c.clearRect(0, 0, WORLD.w, WORLD.h);
  drawRoom(c, t);
  for (const f of furnitures) {
    const isActive = f === activeFurniture;
    if (isActive) drawGlow(c, f.body, t);
    const cx = f.body.x + f.body.w / 2, cy = f.body.y + f.body.h / 2;
    const s = isActive ? 1 + 0.015 * Math.sin(t * 5) : 1;
    c.save();
    c.translate(cx, cy); c.scale(s, s); c.translate(-cx, -cy);
    f.draw(c, f.body, t);
    c.restore();
  }
  drawPlayer(c, t);
  if (activeFurniture) drawBubble(c, activeFurniture, t);
  drawHint(c);
}

/* ============================================================
 * 模块七：面板框架（打开暂停移动 / 关闭强制保存）

const dim = document.getElementById('dim');

function openPanel(id) {
  if (gamePaused) closePanels(false);
  document.getElementById(id).classList.add('open');
  dim.classList.add('show');
  gamePaused = true;
  player.touch = 1; // 触发小人的触碰动作
  renderPanelContent(id);
}
function closePanels(forceSave) {
  document.querySelectorAll('.panel.open').forEach(el => el.classList.remove('open'));
  dim.classList.remove('show');
  gamePaused = false;
  pendingOpen = null;
  if (forceSave !== false) saveAll(true); // 面板关闭立即强制同步保存
}
function renderPanelContent(id) {
  if (id === 'panel-records') { renderRecords(); }
  else if (id === 'panel-board') { renderBoardChips(); renderBoardList(); }
  else if (id === 'panel-cabinet') { renderCabinet(); }
  else if (id === 'panel-sofa') { renderStats(); renderReminderNow(); }
}
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closePanels()));
dim.addEventListener('click', () => closePanels());

  renderBoardChips(); renderBoardList();
  renderStats(); renderReminderNow();
  renderCabinet();
}

/* ============================================================
 * 模块八：投递记录管理面板（电脑）
 * ============================================================ */
const recordsList = document.getElementById('records-list');
const recordForm = document.getElementById('record-form');
const addRecordBtn = document.getElementById('btn-add-record');
const cancelFormBtn = document.getElementById('btn-cancel-form');
const fCompany = document.getElementById('f-company');
const fRole = document.getElementById('f-role');
const fDate = document.getElementById('f-date');
const fStatus = document.getElementById('f-status');
const fNote = document.getElementById('f-note');
const fLink = document.getElementById('f-link');
let editingId = null;

function renderRecords() {
  if (!records.length) {
    recordsList.innerHTML = '<div class="empty"><span class="big">🥚</span>还没有投递记录，从第一份开始吧<br>点「＋ 添加记录」写下第一家公司</div>';
    return;
  }
  recordsList.innerHTML = records.map(r => {
    const linkHTML = safeLinkHTML(r.link);
    return '<div class="rec-card" data-id="' + esc(r.id) + '">' +
      '<div class="rec-top"><span class="rec-company">' + (esc(r.company) || '（未填写公司）') + '</span>' +
      '<span class="badge s-' + esc(r.status) + '">' + esc(r.status) + '</span></div>' +
      '<div class="rec-sub">' + (esc(r.role) || '未填写岗位') + ' · ' + (esc(r.applyDate) || '未填写日期') + '</div>' +
      (r.note ? '<div class="rec-note">' + esc(r.note) + '</div>' : '') +
      linkHTML +
      '<div class="rec-actions">' +
      '<button class="btn btn-sm" data-act="edit">✏️ 编辑</button>' +
      '<button class="btn btn-sm btn-del" data-act="del">🗑 删除</button>' +
      '</div></div>';
  }).join('');
}
recordsList.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const card = btn.closest('.rec-card');
  const rec = records.find(r => r.id === card.dataset.id);
  if (!rec) return;
  if (btn.dataset.act === 'edit') { startEdit(rec); return; }
  /* 删除需自定义确认框二次确认 */
  const choice = await showConfirm('删除这条记录？',
    '确定要删除「' + (rec.company || '未命名') + ' · ' + (rec.role || '未命名岗位') + '」吗？删除后无法恢复。',
    [{ label: '确认删除', value: 'ok', danger: true }, { label: '再想想', value: 'no' }]);
  if (choice === 'ok') {
    records = records.filter(r => r.id !== rec.id);
    saveAll(true);
    refreshAllViews();
    showToast('已删除');
  }
});

function fillForm(src) {
  fCompany.value = src.company || '';
  fRole.value = src.role || '';
  fDate.value = src.applyDate || '';
  fStatus.value = STATUSES.includes(src.status) ? src.status : '未投递';
  fNote.value = src.note || '';
  fLink.value = src.link || '';
}
function showForm() { recordForm.classList.remove('hidden'); addRecordBtn.style.display = 'none'; }
function hideForm() { recordForm.classList.add('hidden'); addRecordBtn.style.display = ''; editingId = null; }

function startAdd() {
  editingId = null;
  fillForm(draft); // 恢复上次未提交的草稿
  if (!fDate.value) fDate.value = today();
  showForm();
  fCompany.focus();
}
function startEdit(rec) {
  editingId = rec.id;
  fillForm(rec);
  showForm();
  fCompany.focus();
}
addRecordBtn.addEventListener('click', startAdd);
cancelFormBtn.addEventListener('click', hideForm);

recordForm.addEventListener('submit', e => {
  e.preventDefault();
  const company = fCompany.value.trim(), role = fRole.value.trim();
  if (!company || !role) { showToast('公司名称和岗位都要填哦'); return; }
  const data = {
    company, role,
    applyDate: fDate.value,
    status: fStatus.value,
    note: fNote.value.trim(),
    link: fLink.value.trim()
  };
  if (editingId) {
    const r = records.find(x => x.id === editingId);
    if (r) Object.assign(r, data);
  } else {
    records.unshift(Object.assign({ id: uid() }, data));
  }
  draft = {};
  saveAll(true);
  hideForm();
  refreshAllViews();
  showToast('已保存 ✓');
});

/* 输入变化：编辑态实时更新记录，新增态保存草稿；均 300ms 防抖写库 */
const onFormInput = () => {
  if (editingId) {
    const r = records.find(x => x.id === editingId);
    if (r) {
      r.company = fCompany.value; r.role = fRole.value;
      r.applyDate = fDate.value; r.status = fStatus.value;
      r.note = fNote.value; r.link = fLink.value;
      scheduleSave();
      renderRecords();
    }
  } else {
    draft = { company: fCompany.value, role: fRole.value, applyDate: fDate.value, status: fStatus.value, note: fNote.value, link: fLink.value };
    scheduleSave();
  }
};
['input', 'change'].forEach(ev => recordForm.addEventListener(ev, onFormInput));

/* ============================================================
 * 模块九：状态筛选面板（白板）
 * ============================================================ */
const boardChips = document.getElementById('board-chips');
const boardList = document.getElementById('board-list');
let boardFilter = '全部';

function renderBoardChips() {
  const counts = {};
  STATUSES.forEach(s => counts[s] = 0);
  records.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
  const total = records.length;
  boardChips.innerHTML = ['全部'].concat(STATUSES).map(s =>
    '<button class="chip' + (boardFilter === s ? ' active' : '') + '" data-status="' + esc(s) + '">' + esc(s) +
    ' <span class="cnt">' + (s === '全部' ? total : (counts[s] || 0)) + '</span></button>'
  ).join('');
}
boardChips.addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  boardFilter = b.dataset.status;
  renderBoardChips();
  renderBoardList();
});
function renderBoardList() {
  const items = boardFilter === '全部' ? records : records.filter(r => r.status === boardFilter);
  if (!items.length) {
    boardList.innerHTML = '<div class="empty"><span class="big">🌱</span>' +
      (boardFilter === '全部' ? '还没有投递记录' : '这个状态下还没有记录') + '</div>';
    return;
  }
  boardList.innerHTML = items.map(r =>
    '<div class="board-row"><div class="board-main">' +
    '<div class="board-name">' + esc(r.company) + '</div>' +
    '<div class="board-sub">' + esc(r.role) + ' · ' + esc(r.applyDate) + '</div></div>' +
    '<span class="badge s-' + esc(r.status) + '">' + esc(r.status) + '</span></div>'
  ).join('');
}

/* ============================================================
 * 模块十：数据备份与导出面板（文件柜）
 * ============================================================ */
const cabinetInfo = document.getElementById('cabinet-info');
const exportBtn = document.getElementById('btn-export');
const importBtn = document.getElementById('btn-import');
const importFile = document.getElementById('import-file');

function renderCabinet() {
  const last = meta.lastSavedAt ? new Date(meta.lastSavedAt).toLocaleString('zh-CN', { hour12: false }) : '——';
  cabinetInfo.innerHTML = '共 <b>' + records.length + '</b> 条记录 · 最后保存于 <b>' + last + '</b>';
}

/* 导出：打包全部数据为 JSON 并触发下载 */
exportBtn.addEventListener('click', () => {
  const payload = {
    app: 'wb_internship_console',
    version: 1,
    exportedAt: new Date().toISOString(),
    records,
    reminderText,
    meta
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wb-internship-backup-' + today().replace(/-/g, '') + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('已导出备份文件');
});

/* 导入：读取 JSON → 校验结构 → 自定义确认选择覆盖 / 合并 / 取消 */
importBtn.addEventListener('click', () => importFile.click());
importFile.addEventListener('change', async () => {
  const file = importFile.files[0];
  importFile.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { await showConfirm('导入失败', '文件不是有效的 JSON，无法识别为备份数据。', [{ label: '好的', value: 'ok' }]); return; }
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.records) ? data.records : null);
  if (!arr) { await showConfirm('导入失败', '文件里没有找到投递记录列表（records 字段）。', [{ label: '好的', value: 'ok' }]); return; }
  const cleaned = arr.map(sanitizeRecord).filter(Boolean);
  const choice = await showConfirm('导入备份',
    '检测到 ' + cleaned.length + ' 条记录，想怎么导入？',
    [{ label: '覆盖导入', value: 'replace', danger: true }, { label: '合并导入', value: 'merge' }, { label: '取消', value: 'cancel' }]);
  if (choice === 'replace') {
    records = cleaned;
  } else if (choice === 'merge') {
    const map = new Map(records.map(r => [r.id, r]));
    cleaned.forEach(r => map.set(r.id, r));
    records = Array.from(map.values());
  } else { return; }
  saveAll(true);
  refreshAllViews();
  showToast('导入成功 ✓');
});
function sanitizeRecord(r) {
  if (!r || typeof r !== 'object') return null;
  return {
    id: (typeof r.id === 'string' && r.id) ? r.id : uid(),
    company: String(r.company || '').slice(0, 100),
    role: String(r.role || '').slice(0, 100),
    applyDate: typeof r.applyDate === 'string' ? r.applyDate.slice(0, 10) : '',
    status: STATUSES.includes(r.status) ? r.status : '未投递',
    note: String(r.note || '').slice(0, 300),
    link: String(r.link || '').slice(0, 500)
  };
}

/* ============================================================
 * 模块十一：统计与提醒面板（沙发）
 * ============================================================ */
const statsCards = document.getElementById('stats-cards');
const reminderInput = document.getElementById('reminder-input');
const reminderNow = document.getElementById('reminder-now');

function renderStats() {
  const total = records.length;
  const inProgress = records.filter(r => ['已投递', '笔试', '面试'].includes(r.status)).length;
  const offer = records.filter(r => r.status === 'Offer').length;
  const fail = records.filter(r => r.status === '已挂').length;
  statsCards.innerHTML =
    statCard('📭', total, '总投递') +
    statCard('🔄', inProgress, '进行中') +
    statCard('🎉', offer, 'Offer') +
    statCard('😢', fail, '已挂');
}
function statCard(emoji, num, label) {
  return '<div class="stat-card"><span class="stat-emoji">' + emoji + '</span>' +
    '<div class="stat-num">' + num + '</div><div class="stat-label">' + label + '</div></div>';
}
reminderInput.value = reminderText;
reminderInput.addEventListener('input', () => {
  reminderText = reminderInput.value;
  scheduleSave();
  renderReminderNow();
});
function renderReminderNow() {
  const t = (reminderText || '').trim();
  reminderNow.innerHTML = t
    ? '当前提醒：<b>' + esc(t) + '</b>'
    : '还没有提醒，写一句给自己加油吧';
}

/* ============================================================
 * 模块十二：帮助面板（书架）与清空数据
 * ============================================================ */
document.getElementById('btn-clear-all').addEventListener('click', async () => {
  const c1 = await showConfirm('清空所有数据？',
    '这会删除全部投递记录、提醒和草稿，且无法恢复。',
    [{ label: '继续', value: 'ok', danger: true }, { label: '取消', value: 'no' }]);
  if (c1 !== 'ok') return;
  const c2 = await showConfirm('最后确认',
    '真的要清空吗？建议先到「文件柜」导出一份备份。',
    [{ label: '确认清空', value: 'ok', danger: true }, { label: '再想想', value: 'no' }]);
  if (c2 !== 'ok') return;
  Object.values(STORAGE_KEYS).forEach(k => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } });
  records = []; reminderText = ''; draft = {}; meta = { version: 1, lastSavedAt: null, seenIntro: true };
  saveAll(true);
  refreshAllViews();
  showToast('数据已清空');
});

/* ============================================================
 * 模块十三：Toast 与自定义确认框
 * ============================================================ */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1200);
}

const confirmMask = document.getElementById('confirm-mask');
const confirmTitle = document.getElementById('confirm-title');
const confirmMsg = document.getElementById('confirm-msg');
const confirmActions = document.getElementById('confirm-actions');
let confirmResolve = null;

function showConfirm(title, msg, buttons) {
  return new Promise(resolve => {
    confirmResolve = resolve;
    confirmTitle.textContent = title;
    confirmMsg.textContent = msg;
    confirmActions.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn' + (b.danger ? ' btn-danger' : '');
      btn.textContent = b.label;
      btn.addEventListener('click', () => { hideConfirm(); resolve(b.value); });
      confirmActions.appendChild(btn);
    });
    confirmMask.classList.add('show');
  });
}
function hideConfirm() { confirmMask.classList.remove('show'); confirmResolve = null; }
confirmMask.addEventListener('click', e => {
  if (e.target === confirmMask) { hideConfirm(); if (confirmResolve) confirmResolve(null); }
});

/* ============================================================
 * 模块十四：主循环与初始化
 * ============================================================ */
let rafId = null, lastTime = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
  lastTime = ts;
  if (!gamePaused) update(dt);
  render(ts / 1000);
  rafId = requestAnimationFrame(frame);
}
function startLoop() { lastTime = performance.now(); rafId = requestAnimationFrame(frame); }
function stopLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = null; }
/* 切后台自动暂停主循环，回到前台恢复 */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLoop();
  else if (!rafId) startLoop();
});

/* —— 启动 —— */
loadAll();
resizeCanvas();
refreshAllViews();
startLoop();
if (!meta.seenIntro) {
  meta.seenIntro = true;
  saveAll(false);
  setTimeout(() => showToast('走到家具旁，按 E 或点击打开面板'), 600);
}
})();
</script>
